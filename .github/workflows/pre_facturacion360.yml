name: Flujo CI/CD Preproducción Facturación 360

on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: facturacion360-preproduccion
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: microsoft
          cache: maven
          cache-dependency-path: facturacion360/pom.xml

      - name: Build and test
        run: mvn -B -f facturacion360/pom.xml clean install

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: facturacion360-preproduccion-${{ github.run_id }}
          path: facturacion360/target/facturacion360-0.0.1-SNAPSHOT.jar
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: preproduccion
      url: https://facturacion360-test-frdra3cwhcafdffp.spaincentral-01.azurewebsites.net/
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: facturacion360-preproduccion-${{ github.run_id }}

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_642D984BD69A4123BD4516BDF6A92598 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_EF1EA35E99574A11A892A854B7D13EE7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8FACD0C54BD24932A0E028249E3A2CC3 }}

      - name: Deploy to preproduction Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: facturacion360-test
          package: 'facturacion360-0.0.1-SNAPSHOT.jar'
