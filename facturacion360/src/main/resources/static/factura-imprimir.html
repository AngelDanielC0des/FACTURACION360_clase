<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor de factura | Facturación 360</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="factura-imprimir.css">
    <!-- Icono que aparece en la pestaña del navegador. -->
    <link rel="icon" href="./img/fav.ico" type="image/x-icon">
    <!--
        Estilo dinámico para el formato de papel. Arranca vacío: sin regla @page con "size:",
        el navegador usa el papel configurado en la impresora. El JS sobreescribe este bloque
        cuando el usuario elige un formato concreto en el selector.
    -->
    <style id="estiloFormatoPapel"></style>
    <script type="module" src="factura-imprimir.js"></script>
</head>
<body>
    <div class="acciones-visor container py-3 d-flex flex-wrap gap-2 justify-content-between align-items-center">
        <a href="facturas.html" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Volver
        </a>

        <div class="d-flex flex-wrap align-items-center gap-2">
            <a id="botonEditarBorrador" class="btn btn-outline-primary d-none">Editar borrador</a>

            <!--
                Selector de formato de papel. La opción "Por defecto" deja el @page sin "size:",
                lo que respeta el papel configurado por el usuario en el diálogo de impresión
                (el borrador se queda como referencia en A4). Las demás opciones inyectan
                @page { size: X } mediante JS y redimensionan la hoja del borrador para que
                la vista en pantalla coincida con lo que se imprimirá.
            -->
            <div class="d-flex align-items-center gap-2">
                <label for="selectFormatoPapel" class="form-label mb-0 small text-muted text-nowrap">
                    Formato:
                </label>
                <select id="selectFormatoPapel" class="form-select form-select-sm" style="width: auto;">
                    <option value="">Por defecto (impresora)</option>
                    <option value="A4" selected>A4</option>
                    <option value="letter">Carta (US Letter)</option>
                    <option value="A5">A5</option>
                </select>
            </div>

            <button id="botonImprimir" type="button" class="btn btn-primary" disabled>
                <i class="bi bi-printer"></i> Imprimir / Guardar PDF
            </button>
        </div>
    </div>

   <main id="documentoFactura" class="documento-factura" aria-busy="true">
        <!-- La región viva que lee el lector de pantalla: el visor no tenía ninguna, así que
             quien no ve la pantalla no se enteraba ni de que la factura había fallado. -->
        <p id="anuncios" class="visually-hidden" role="status"></p>

        <!-- El rótulo de estado del visor hace de franja de avisos. Arranca con texto puesto
             a propósito: "Cargando factura..." es un estado, y desaparece cuando la factura
             entra (limpiar) o se vuelve rojo si falla (fijar). -->
        <p id="estadoVisor" class="aviso">Cargando factura...</p>

        <div id="contenidoFactura" class="d-none">
            <!--
                Marca de agua visible solo en borradores. Se muestra tanto en pantalla como
                en impresión para que el PDF resultante no pueda confundirse con una factura
                real emitida. aria-hidden="true": es decorativa, el estado ya se comunica
                por texto en el encabezado de la factura.
            -->
            <p id="marcaAgua" class="marca-agua d-none" aria-hidden="true">BORRADOR</p>

            <header class="cabecera-factura d-flex justify-content-between align-items-start gap-4">
                <div class="d-flex align-items-center gap-3">
                    <img id="logoEmisor" src="/emisor/logo" alt="Logo emisor"
                         class="logo-emisor"
                         style="height: 100px; width: auto; max-height: 100px;"
                         onerror="this.style.display='none'">
                    <div>
                        <h1 id="nombreEmisorCabecera" class="h4 mb-0 text-primary">Facturación 360</h1>
                        <p class="mb-0 text-muted small">Documento de factura</p>
                    </div>
                </div>

                <div class="d-flex align-items-start gap-4 ms-auto">
                    <div class="text-end">
                        <h2 id="numeroFactura" class="h5 mb-1"></h2>
                        <p id="fechaFactura" class="mb-0 small"></p>
                        <p id="estadoFactura" class="mb-0 small text-muted"></p>
                    </div>

                    <!--
                        Bloque QR · Orden HAC/1177/2024, art. único, apdo. 3.
                        Requisitos de impresión:
                          - Norma ISO/IEC 18004:2015, nivel de corrección M.
                          - Tamaño: entre 30×30 mm y 40×40 mm.
                          - Zona de silencio: ≥ 2 mm (se usan 6 mm recomendados).
                          - Texto encima: «QR tributario:» (distingue este QR del de pago).
                          - Texto debajo: «VERI*FACTU» con subtexto explicativo.
                          - Ambos textos con tamaño ≥ al cuerpo de la factura (≥ 9pt).
                          - Posición: arriba, margen superior derecho.
                        Solo se muestra si la factura está emitida. El JS oculta este bloque
                        para borradores y el backend devuelve 404 si se pide el PNG directamente.
                    -->
                    <figure id="bloqueQr" class="bloque-verifactu d-none"
                            aria-label="Código QR de verificación fiscal">
                        <p class="rotulo-qr">QR tributario:</p>
                        <img id="imagenQr"
                             class="qr-verifactu"
                             src=""
                             alt="Código QR para verificar esta factura en la sede electrónica de la AEAT"
                             onerror="this.closest('.bloque-verifactu').classList.add('d-none')">
                        <figcaption class="leyenda-verifactu">
                            VERI*FACTU
                            <small>Factura verificable en la sede electrónica de la AEAT</small>
                        </figcaption>
                    </figure>
                </div>
            </header>

<div class="datos-partes mb-4">
    <div class="row">
        <div class="col-6 border-end">
            <section aria-labelledby="tituloEmisor">
                <h2 id="tituloEmisor" class="h6 fw-bold border-bottom pb-2 mb-2">Emisor</h2>
                <p id="nombreEmisor" class="fw-bold mb-1"></p>
                <p id="cifEmisor" class="mb-1"></p>
                <p id="direccionEmisor" class="mb-1"></p>
                <p id="contactoEmisor" class="mb-0"></p>
            </section>
        </div>
        <div class="col-6">
            <section class="ps-2" aria-labelledby="tituloCliente">
                <h2 id="tituloCliente" class="h6 fw-bold border-bottom pb-2 mb-2">Cliente</h2>
                <p id="nombreCliente" class="fw-bold mb-1"></p>
                <p id="nifCliente" class="mb-1"></p>
                <p id="direccionCliente" class="mb-1"></p>
                <p id="contactoCliente" class="mb-0"></p>
            </section>
        </div>
    </div>
</div>

            <section id="bloqueConceptos" aria-labelledby="tituloConceptos">
                <h2 id="tituloConceptos" class="h5">Conceptos</h2>
                <div class="table-responsive">
                    <table class="table table-bordered align-middle">
                        <thead>
                            <tr>
                                <th scope="col">Descripción</th>
                                <th scope="col" class="text-end">Cantidad</th>
                                <th scope="col" class="text-end">Precio</th>
                                <th scope="col" class="text-end">Dto.</th>
                                <th scope="col" class="text-end">Base</th>
                                <th scope="col" class="text-end">IVA</th>
                                <th scope="col" class="text-end">Total</th>
                            </tr>
                        </thead>
                        <tbody id="tablaConceptos"></tbody>
                    </table>
                </div>
            </section>

            <!-- El IVA agrupado por tipo. Una factura con lineas al 21 % y al 10 % tiene que
                 ensenar cuanta base va a cada tipo y cuanta cuota sale de cada una; el total
                 de IVA por si solo no deja comprobar nada. Es ademas el Desglose que exige la
                 AEAT en el registro de Verifactu, asi que lo que se imprime y lo que se
                 declara salen del mismo sitio. -->
            <div class="d-flex justify-content-between align-items-start mt-4 mb-4 gap-4 flex-wrap flex-sm-nowrap fila-desglose-totales">
                <section id="bloqueDesglose" class="desglose-factura flex-grow-1 d-none" aria-labelledby="tituloDesglose">
                    <h2 id="tituloDesglose" class="h6">Desglose del IVA</h2>
                    <table class="table table-sm tabla-desglose">
                        <thead>
                            <tr>
                                <th scope="col" class="text-end">Base imponible</th>
                                <th scope="col" class="text-end">Tipo</th>
                                <th scope="col" class="text-end">Cuota</th>
                            </tr>
                        </thead>
                        <tbody id="tablaDesglose"></tbody>
                    </table>
                </section>

                <div class="totales-factura flex-shrink-0" style="width: 320px; max-width: 100%;">
                    <div><span>Subtotal</span><strong id="subtotalFactura"></strong></div>
                    <div><span>IVA</span><strong id="ivaFactura"></strong></div>
                    <div class="total-final"><span>Total</span><strong id="totalFactura"></strong></div>
                </div>
            </div>

            <section id="bloqueObservaciones" class="observaciones-factura d-none" aria-labelledby="tituloObservaciones">
                <h2 id="tituloObservaciones" class="h5">Observaciones</h2>
                <p id="observacionesFactura" class="mb-0"></p>
            </section>
        </div>
    </main>
</body>
</html>
